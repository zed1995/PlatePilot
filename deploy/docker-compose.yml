# Local PostgreSQL for PlatePilot.
#
# The image is built rather than pulled because no published image carries
# both pgvector and PostGIS for arm64; see deploy/postgres/Dockerfile.
services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: platepilot-postgres
    environment:
      POSTGRES_USER: platepilot
      POSTGRES_PASSWORD: platepilot
      POSTGRES_DB: platepilot
      # Deterministic collation so text search and ORDER BY do not change
      # between a developer's machine and CI.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "55432:5432"
    volumes:
      - platepilot-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platepilot -d platepilot"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  platepilot-pgdata:
