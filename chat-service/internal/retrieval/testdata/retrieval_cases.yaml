  # ---------------------------------------------------------------------
  # Broad semantic questions, judged on the page rather than on a recalled set.
  #
  # These carry no `restaurant_ids`. The first draft of this block did, and it
  # was wrong in a way that mattered: each case named three restaurants a person
  # would recognise — Los Tacos No.1 for tacos, Di Fara Pizza for pizza — and
  # scored the run on whether those three came back. But "a pizza place in
  # brooklyn" has hundreds of correct answers and five result slots, so the
  # score measured which of many right answers the ranker happened to prefer.
  # On the first run it reported 0.00 for a page of five Brooklyn pizzerias,
  # which is a correct answer marked as a total failure.
  #
  # Recall is the right instrument for a question with a small determinate
  # answer set — a name, a narrow filter — and it is still used for those above.
  # For a broad question the standard instrument is precision over the page the
  # user actually sees, so that is what these assert: every returned restaurant
  # is judged relevant when it carries one of the cuisines named here, and the
  # case fails when the page is not mostly answers to the question it was
  # returned for.
  #
  # The cuisines listed per case are the tags that answer the question, which is
  # a judgement stated in the fixture rather than a number read off a run. A
  # "vegetarian and vegan options" page may reasonably be a salad counter, and a
  # "weekend brunch" page may reasonably be a diner, so those sets are wider
  # than the cuisine in the query.
  # ---------------------------------------------------------------------
  - id: soft_mexican_tacos_manhattan
    kind: restaurant
    query: "tacos and mexican food in manhattan"
    filter:
      borough: manhattan
    expect:
      min_results: 5
      all_satisfy_filter: true
      result_cuisines: [mexican, taco, mexican_torta]
      min_relevant_ratio: 0.6

