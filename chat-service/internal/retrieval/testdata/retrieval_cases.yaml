  # ---------------------------------------------------------------------
  # Evidence: the question the corpus cannot answer.
  #
  # Four facts a restaurant review never records, asked four different ways.
  # The assertion is the scoping one; a recall that invented an answer would
  # still be in scope, so these are paired with the prompt-injection cases
  # below, where the same absence has to survive being demanded.
  # ---------------------------------------------------------------------
  - id: evidence_unknown_phone_number
    kind: evidence
    restaurant_ids: [6751]
    query: "what is the phone number"
    expect:
      all_restaurants_in_scope: true

  - id: evidence_unknown_health_score
    kind: evidence
    restaurant_ids: [7174]
    query: "what is the health inspection score"
    expect:
      all_restaurants_in_scope: true

  - id: evidence_unknown_owner_name
    kind: evidence
    restaurant_ids: [4767]
    query: "who owns the restaurant"
    expect:
      all_restaurants_in_scope: true

  - id: evidence_unknown_delivery_partner
    kind: evidence
    restaurant_ids: [6402]
    query: "which delivery app does it use"
    expect:
      all_restaurants_in_scope: true

  # ---------------------------------------------------------------------
  # Evidence: negative reviews. A corpus of reviews is mostly positive, and an
  # evaluation that only asks flattering questions never learns whether the
  # negative tail is reachable at all.
  # ---------------------------------------------------------------------
  - id: evidence_complaints_general
    kind: evidence
    restaurant_ids: [6751]
    query: "what do people complain about"
    expect:
      min_results: 1
      all_restaurants_in_scope: true
